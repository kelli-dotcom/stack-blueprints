<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 285" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041524"/>
      <stop offset="52%" stop-color="#072844"/>
      <stop offset="100%" stop-color="#031220"/>
    </linearGradient>
    <linearGradient id="oceanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="285" rx="14" fill="url(#oceanBg)" stroke="#0284c7" stroke-width="2"/>
  <!-- Subtle Ocean Contour Waves -->
  <path d="M0 230 Q 270 195 540 228 T 1080 215 L 1080 285 L 0 285 Z" fill="#0ea5e9" opacity="0.07"/>
  <path d="M0 252 Q 320 225 640 250 T 1080 238 L 1080 285 L 0 285 Z" fill="#38bdf8" opacity="0.09"/>

  <!-- Left Brand & Value Block -->
  <text x="54" y="64" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.2">🔵 STACK-BLUEPRINTS // TIER &amp; FILE-ORDER ENGINE</text>
  <text x="54" y="118" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.6">Stack Blueprints</text>
  <rect x="54" y="132" width="380" height="3.5" rx="2" fill="url(#oceanBar)"/>
  <text x="54" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500">Right-size any build from &lt; 5 KB Featherweight to Enterprise—with exact file-creation orders.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
    <rect x="54" y="194" width="144" height="34" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1.3"/>
    <text x="126" y="215" fill="#7dd3fc" text-anchor="middle">5 STACK TIERS</text>

    <rect x="210" y="194" width="164" height="34" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="292" y="215" fill="#e0f2fe" text-anchor="middle">5 FILE ORDERS</text>

    <rect x="386" y="194" width="154" height="34" rx="6" fill="#082f49" stroke="#2dd4bf" stroke-width="1.3"/>
    <text x="463" y="215" fill="#5eead4" text-anchor="middle">0 DEPENDENCIES</text>
  </g>

  <!-- Right Visual: Layered 5-Tier Stack Pyramid (Narrow Feather Top -> Wide Enterprise Base) -->
  <g transform="translate(650, 34)" font-family="ui-monospace, SFMono-Regular, monospace">
    <!-- Tier 0 -->
    <rect x="112" y="0" width="166" height="36" rx="6" fill="#0c4a6e" stroke="#2dd4bf" stroke-width="1.6"/>
    <text x="195" y="22" fill="#5eead4" font-size="11.5" font-weight="800" text-anchor="middle">T0 · FEATHER (&lt;5 KB)</text>

    <!-- Tier 1 -->
    <rect x="84" y="44" width="222" height="36" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="195" y="66" fill="#e0f2fe" font-size="11.5" font-weight="700" text-anchor="middle">T1 · LIGHT WEB (&lt;60 KB)</text>

    <!-- Tier 2 -->
    <rect x="56" y="88" width="278" height="36" rx="6" fill="#0369a1" stroke="#7dd3fc" stroke-width="1.6"/>
    <text x="195" y="110" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">T2 · BALANCED SAAS (~115 KB)</text>

    <!-- Tier 3 -->
    <rect x="28" y="132" width="334" height="36" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="195" y="154" fill="#bae6fd" font-size="11.5" font-weight="700" text-anchor="middle">T3 · MOBILE + WEB OFFLINE SYNC</text>

    <!-- Tier 4 -->
    <rect x="0" y="176" width="390" height="38" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <text x="195" y="199" fill="#7dd3fc" font-size="11.5" font-weight="700" text-anchor="middle">T4 · HEAVY MONOREPO + WORKERS + K8S</text>
  </g>
</svg>
