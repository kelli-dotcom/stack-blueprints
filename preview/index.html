<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stack Blueprints — Live 5-Tier Stack Recommender &amp; File-Order Explorer</title>
  <style>
    :root {
      --bg: #041524;
      --panel: #072238;
      --card: #0b3150;
      --border: #0e4a75;
      --text: #f0f9ff;
      --muted: #93c5fd;
      --ocean: #0ea5e9;
      --sky: #38bdf8;
      --teal: #2dd4bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #083358 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 26px 20px;
      line-height: 1.5;
      min-height: 100vh;
    }
    .container { max-width: 1140px; margin: 0 auto; }
    .header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 20px; margin-bottom: 18px;
    }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--sky); letter-spacing: 1.8px; font-weight: 700; }
    h1 { font-size: 23px; font-weight: 800; margin-top: 2px; }
    .sub { font-size: 13px; color: #bae6fd; opacity: 0.85; }
    .badge {
      padding: 6px 13px; border-radius: 6px; font-size: 12px; font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, monospace;
      background: rgba(45, 212, 191, 0.14); color: var(--teal); border: 1px solid var(--teal);
    }
    .repo-link {
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none;
      color: #e0f2fe; border: 1px solid var(--border); background: var(--card);
    }
    .recommender {
      display: flex; flex-wrap: wrap; align-items: end; gap: 12px;
      background: var(--panel); border: 1px solid var(--ocean); border-radius: 10px;
      padding: 14px 18px; margin-bottom: 18px;
    }
    .field { flex: 1; min-width: 200px; }
    .field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--sky); margin-bottom: 5px; letter-spacing: 0.6px; }
    .field select {
      width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 6px; font-size: 13px;
    }
    .btn {
      cursor: pointer; border-radius: 6px; padding: 9px 15px; font-size: 12px; font-weight: 800;
      border: 1px solid var(--sky); background: var(--ocean); color: #02101d;
    }
    .btn:hover { background: var(--sky); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel); color: #cbd5e1; border: 1px solid var(--border);
      padding: 8px 13px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { border-color: var(--sky); color: #fff; background: #0c4a6e; }
    .grid { display: grid; grid-template-columns: 1.12fr 0.88fr; gap: 18px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .panel h2 { font-family: ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--sky); margin-bottom: 12px; }
    .spec-row {
      display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
      border-bottom: 1px solid rgba(147, 197, 253, 0.12); font-size: 13px;
    }
    .spec-row strong { color: #93c5fd; }
    .spec-row span { font-family: ui-monospace, SFMono-Regular, monospace; color: var(--text); text-align: right; max-width: 68%; }
    .order-step {
      background: #051a2d; border-left: 3px solid var(--ocean); border-radius: 5px;
      padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px;
    }
    .order-step code { color: var(--teal); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; display: block; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="eyebrow">🔵 STACK-BLUEPRINTS // LIVE INTERACTIVE RECOMMENDER</div>
        <h1>5-Tier Stack Matrix &amp; File-Order Explorer</h1>
        <p class="sub">Pick your device RAM and project goal — right-sizes your stack from &lt; 5 KB Featherweight to Enterprise.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <div id="activeTierBadge" class="badge">TIER 0 · &lt; 5 KB</div>
        <a class="repo-link" href="https://github.com/kelli-dotcom/stack-blueprints" target="_blank" rel="noopener">GitHub Repo ↗</a>
      </div>
    </div>

    <div class="recommender">
      <div class="field">
        <label for="ramInput">Available Device / Host RAM</label>
        <select id="ramInput" onchange="autoRecommend()">
          <option value="1">1–2 GB RAM (Chromebook / Phone / $5 VPS)</option>
          <option value="4" selected>4–8 GB RAM (Standard Laptop / Container)</option>
          <option value="16">16 GB+ RAM (Full Dev Workstation / Cluster)</option>
        </select>
      </div>
      <div class="field">
        <label for="goalInput">What Are You Building?</label>
        <select id="goalInput" onchange="autoRecommend()">
          <option value="micro">Micro-tool, Theme Kit, Calculator, or CLI</option>
          <option value="mvp">Fast Content Site, Directory, or Solo MVP</option>
          <option value="saas" selected>Full-Stack Web App / AI Search SaaS</option>
          <option value="mobile">Offline-Capable Mobile + Web Field App</option>
          <option value="enterprise">Multi-Team High-Throughput Platform</option>
        </select>
      </div>
      <button class="btn" type="button" onclick="copyBlueprint()" id="copyBtn">Copy Stack &amp; File Order</button>
    </div>

    <div class="tabs" id="tierTabs">
      <button class="tab-btn" onclick="selectTier(0)">Tier 0 · Feather (&lt;5 KB)</button>
      <button class="tab-btn" onclick="selectTier(1)">Tier 1 · Light Web (&lt;60 KB)</button>
      <button class="tab-btn" onclick="selectTier(2)">Tier 2 · Balanced SaaS (~115 KB)</button>
      <button class="tab-btn" onclick="selectTier(3)">Tier 3 · Mobile + Web</button>
      <button class="tab-btn" onclick="selectTier(4)">Tier 4 · Heavy Enterprise</button>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>01 · Recommended Stack Specification</h2>
        <div id="stackDetails"></div>
      </div>

      <div class="panel">
        <h2>02 · Exact File-Creation Order</h2>
        <div class="tabs" id="orderTabs" style="margin-bottom:12px;">
          <button class="tab-btn active" onclick="selectOrder('kickoff')">Kickoff</button>
          <button class="tab-btn" onclick="selectOrder('feature')">Feature</button>
          <button class="tab-btn" onclick="selectOrder('audit')">Audit</button>
          <button class="tab-btn" onclick="selectOrder('launch')">Launch</button>
        </div>
        <div id="orderDetails"></div>
      </div>
    </div>
  </div>

  <script>
    const TIERS = [
      {
        tier: 0, name: "Tier 0 · Featherweight (Ultra-Light)", bundle: "< 5 KB", ram: "1 GB+", speed: "Instant (0ms build)",
        frontend: "HTML5 + Vanilla ES Modules + Feather Themes CSS",
        backend: "Static files or single Node/Bun script (0 npm deps)",
        database: "JSON / LocalStorage / Browser IndexedDB",
        hosting: "GitHub Pages / Cloudflare Pages / Local file",
        bestFor: "Micro-tools, theme explorers, school Chromebooks, calculators, offline utilities",
        crtaExample: "feather-themes, feather-speed, stack-blueprints"
      },
      {
        tier: 1, name: "Tier 1 · Lightweight Fast Web", bundle: "< 60 KB", ram: "2 GB+", speed: "Sub-second build",
        frontend: "Astro or Vite + Preact / TypeScript + Tailwind CSS",
        backend: "Lightweight Edge/Node routes + Feather Speed budgets",
        database: "SQLite / Turso (libSQL)",
        hosting: "Cloudflare Workers / Fly.io / $5 VPS",
        bestFor: "Content directories, docs, fast landing pages, solo MVPs",
        crtaExample: "Editorial & lightweight directory sites"
      },
      {
        tier: 2, name: "Tier 2 · Balanced Full-Stack SaaS", bundle: "~115 KB First Load JS", ram: "4 GB+", speed: "Fast (10–15s prod build)",
        frontend: "Next.js 15 App Router + TypeScript + Tailwind + Feather Themes",
        backend: "Server Components + Drizzle ORM + Feather Speed batching",
        database: "PostgreSQL 16 + pgvector (HNSW semantic index)",
        hosting: "Docker Compose / Vercel / Railway / Render",
        bestFor: "Production SaaS, verified directories, AI-assisted web apps",
        crtaExample: "openflex (135+ verified ATS feeds · Public MIT)"
      },
      {
        tier: 3, name: "Tier 3 · Cross-Platform Mobile + Web", bundle: "Native + <150 KB web", ram: "8 GB+", speed: "Moderate (native builds)",
        frontend: "Expo (React Native) or Flutter + Feather Themes tokens.json",
        backend: "TypeScript API / Postgres + Auth + Realtime",
        database: "PostgreSQL + offline SQLite sync",
        hosting: "EAS / App Store / Google Play + Docker API",
        bestFor: "Field operations, offline-first mobile, NFC/camera workflows",
        crtaExample: "Offline-capable mobile field & asset apps"
      },
      {
        tier: 4, name: "Tier 4 · Heavy High-Scale Enterprise", bundle: "Multi-package monorepo", ram: "16 GB+", speed: "CI-cached builds",
        frontend: "Turborepo Monorepo + Shared Design System + Next.js Apps",
        backend: "Go/Rust/Node workers + Queue Pipelines (Redis/BullMQ)",
        database: "HA PostgreSQL + Read Replicas + Object Storage + Vector DB",
        hosting: "Kubernetes / AWS ECS / Multi-region Docker",
        bestFor: "Multi-team enterprise platforms, high-throughput pipelines",
        crtaExample: "Multi-region worker & compliance platforms"
      }
    ];

    const ORDERS = {
      kickoff: [
        ["1. Visible Agent & Root Contracts", "AGENTS.md -> llms.txt -> HANDOFF.md -> mistakes.md -> LICENSE"],
        ["2. One-Page Spec & Reusable Skill", "docs/START_HERE.md -> skills/*/SKILL.md"],
        ["3. Hygiene & Strict Config", ".gitignore -> .env.example -> package.json -> tsconfig.json"],
        ["4. Schema & Validators", "src/db/schema.ts -> validators -> types"],
        ["5. Pure Single-Job Core (<20 KB/file)", "src/lib/* (zero UI coupling, 100% testable)"],
        ["6. UI + Feather Themes & Speed", "globals.css -> components -> preview/index.html"],
        ["7. CI + Real Live Demo + Brand README", ".github/workflows/ci.yml -> GitHub Pages -> README.md"]
      ],
      feature: [
        ["1. Frame & Guardrails First", "Read START_HERE.md + mistakes.md before editing"],
        ["2. Pure Logic (<20 KB per file)", "src/lib/* + smoke test"],
        ["3. Wire UI with Adaptive Budgets", "src/components/* + Feather Speed tiers"],
        ["4. Verify & Push-Off", "typecheck -> smoke test -> update HANDOFF.md"]
      ],
      audit: [
        ["1. Feather Code-Size & File Gate", "node scripts/verify.mjs (every code file < 20 KB)"],
        ["2. Static Type & Handoff Check", "tsc --noEmit && validate-handoff"],
        ["3. Contrast & Dead-Link Audit", "feather-fix.mjs && live HTTP 200 verification"],
        ["4. Permanent Guardrail Entry", "Log root cause & Never Repeat rule in mistakes.md"]
      ],
      launch: [
        ["1. Publish Real Working Live Demo", "Enable GitHub Pages / hosted app URL (verify HTTP 200)"],
        ["2. Craft Brand-Matched Visuals", "Custom hero-banner.svg + preview.svg matching repo job"],
        ["3. Uneven U README Check", "4 -> 3 -> 2 -> 1 -> 3 -> 5 flow with mobile-safe badges"],
        ["4. Ecosystem Sync", "Update CHANGELOG.md, HANDOFF.md & profile README"]
      ]
    };

    let currentTier = 2;
    let currentOrder = "kickoff";

    function autoRecommend() {
      const ram = Number(document.getElementById("ramInput").value);
      const goal = document.getElementById("goalInput").value;
      const map = { micro: 0, mvp: 1, saas: 2, mobile: 3, enterprise: 4 };
      let idx = map[goal];
      if (ram <= 2 && idx > 1) idx = 1;
      if (ram <= 8 && idx > 3) idx = 3;
      selectTier(idx);
    }

    function selectTier(idx) {
      currentTier = idx;
      const t = TIERS[idx];
      document.querySelectorAll("#tierTabs .tab-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
      document.getElementById("activeTierBadge").textContent = `RECOMMENDED: TIER ${t.tier} · ${t.bundle}`;
      document.getElementById("stackDetails").innerHTML = `
        <div class="spec-row"><strong>Stack Tier</strong><span>${t.name}</span></div>
        <div class="spec-row"><strong>Bundle Target</strong><span style="color:var(--teal);font-weight:700;">${t.bundle}</span></div>
        <div class="spec-row"><strong>Minimum RAM</strong><span>${t.ram}</span></div>
        <div class="spec-row"><strong>Build Speed</strong><span>${t.speed}</span></div>
        <div class="spec-row"><strong>Frontend</strong><span>${t.frontend}</span></div>
        <div class="spec-row"><strong>Backend</strong><span>${t.backend}</span></div>
        <div class="spec-row"><strong>Database</strong><span>${t.database}</span></div>
        <div class="spec-row"><strong>Hosting</strong><span>${t.hosting}</span></div>
        <div class="spec-row"><strong>Best For</strong><span>${t.bestFor}</span></div>
        <div class="spec-row"><strong>Production Proof</strong><span style="color:var(--sky);">${t.crtaExample}</span></div>
      `;
    }

    function selectOrder(key) {
      currentOrder = key;
      const keys = ["kickoff", "feature", "audit", "launch"];
      document.querySelectorAll("#orderTabs .tab-btn").forEach((b, i) => b.classList.toggle("active", keys[i] === key));
      document.getElementById("orderDetails").innerHTML = ORDERS[key]
        .map(([title, code]) => `<div class="order-step"><strong>${title}</strong><code>${code}</code></div>`)
        .join("");
    }

    function copyBlueprint() {
      const t = TIERS[currentTier];
      const steps = ORDERS[currentOrder].map(([title, code]) => `- ${title}: ${code}`).join("\n");
      const text = `# ${t.name}\n- Bundle: ${t.bundle} | Min RAM: ${t.ram}\n- Frontend: ${t.frontend}\n- Backend: ${t.backend}\n- Database: ${t.database}\n\n## File-Creation Order (${currentOrder})\n${steps}`;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById("copyBtn");
      btn.textContent = "✓ Copied Blueprint!";
      setTimeout(() => { btn.textContent = "Copy Stack & File Order"; }, 2200);
    }

    autoRecommend();
    selectOrder("kickoff");
  </script>
</body>
</html>
